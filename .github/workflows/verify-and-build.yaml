name: Verify and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --force

      - name: Lint Typecheck
        run: npm run lint-typecheck

      - name: Lint ESLint
        run: npm run lint-eslint

      - name: Lint Prettier
        run: npm run lint-prettier

      - name: Lint Knip
        run: npm run lint-knip

      - name: Run Tests
        env:
          CI: true
        run: npm test

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --force

      - name: Build Project
        run: echo "Add expo build commands here (e.g., eas build)"
